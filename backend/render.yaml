# render.yaml - Render deployment configuration
# Place this file in your backend root directory

services:
  - type: web
    name: blog-scraper-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        generateValue: true
      - key: RENDER
        value: true
      - key: SUPABASE_URL
        sync: false  # You'll set this manually in Render dashboard
      - key: SUPABASE_KEY
        sync: false  # You'll set this manually in Render dashboard
      - key: MONGODB_URI
        sync: false  # You'll set this manually in Render dashboard
      - key: MONGODB_DATABASE
        value: nexium_blog_db
      - key: FRONTEND_URL
        sync: false  # You'll set this to your Vercel domain

---

# Alternative: If render.yaml doesn't work, create these individual files:

# File 1: Procfile (create this in your backend root)
